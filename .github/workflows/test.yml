name: Test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  # The dataset release the conformance job runs against. Bump it when a new
  # release changes RESOLUTION.md or conformance/resolve.json.
  DATASET_TAG: v2026.11.2

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The ES module build matches the UMD source
        run: node scripts/build-esm.js --check
      - run: npm test

  conformance:
    name: conformance (RESOLUTION.md, strict pair cases)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vehiclesdb/vehiclesdb
          ref: ${{ env.DATASET_TAG }}
          path: .dataset
          sparse-checkout: |
            dist/vehicles.json
            conformance
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Conformance cases through the widget
        env:
          VDB_DATA: ${{ github.workspace }}/.dataset/dist/vehicles.json
          VDB_CONFORMANCE: ${{ github.workspace }}/.dataset/conformance/resolve.json
        run: |
          node --test test/conformance.test.js | tee "$RUNNER_TEMP/tap.txt"
          # The cases must have run: a skip here is a failure.
          grep -q '^# skipped 0$' "$RUNNER_TEMP/tap.txt"
